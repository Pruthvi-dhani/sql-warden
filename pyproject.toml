[project]
name = "sql-warden"
version = "0.1.0"
description = "A governed SQL gateway that lets AI agents query real databases with server-enforced rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
sql-warden = "sql_warden.cli:cli"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_warden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: needs Docker (Postgres via Testcontainers)",
    "snowflake: needs a live Snowflake account (SNOWFLAKE_* env vars)",
]
