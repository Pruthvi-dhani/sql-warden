# sql-warden policy file. Copy to warden.yaml (git-ignored) and adjust:
#
#   cp warden.example.yaml warden.yaml
#   uv run sql-warden config validate
#
# Strings may reference environment variables as ${NAME} or ${NAME:-default}, so secrets can
# stay out of the file. Unknown keys are errors: a section appears here once sql-warden
# enforces it.

version: 1

warehouse:
  engine: postgres
  # The read-only role from dev/docker-compose.yml.
  dsn: postgresql://warden_reader:${WARDEN_READER_PASSWORD:-warden_reader}@localhost:5433/warehouse
  statement_timeout_ms: 5000   # queries running longer are cancelled
  max_rows: 100                # rows returned per query; more are cut off and flagged
  connect_timeout_s: 5

# A query the database's planner estimates above max_total_cost is refused before it runs
# (COST_TOO_HIGH). sql-warden asks with EXPLAIN, which plans a query without running it. The
# units are the planner's own: in Postgres, reading one page from disk in sequence costs 1. On
# the demo data, a full scan of the 1M-row orders table costs about 20,000, and a count over
# orders cross-joined with itself about 10^10.
cost:
  max_total_cost: 1000000

# What one session may use in total. A session is one agent's connection (or the CLI calls
# given the same --session: its usage is read back from the audit log, so a name is one
# session for good), and once it reaches a limit nothing more runs in it
# (BUDGET_EXHAUSTED). A query whose estimated cost is more than the session has left is
# refused too (COST_OVER_BUDGET), though a cheaper one may still fit. No limit is set unless
# you set it, here for every profile or under a profile for that one:
#   max_queries        queries that were allowed and sent to the database
#   max_total_cost     the sum of their estimated costs, in the units of cost.max_total_cost
#   max_rows_returned  rows returned, over all of them
#   max_refusals       requests a check refused, dry runs included: an agent can't try
#                      query after query until one gets through
budgets:
  max_refusals: 50

# The key for hmac masks (see profiles below), shared by every profile. Whoever has it can
# check guesses against masked values, so set it from the environment. The default after :-
# is for the local demo stack only: never use it anywhere else.
masking:
  key: ${WARDEN_MASK_KEY:-demo-only-mask-key-not-for-real-use}

# Every request is recorded here before anything is returned. Always Postgres, on its own
# instance; sql-warden won't start without it, and refuses queries while it is unreachable.
audit:
  dsn: postgresql://warden_audit:${WARDEN_AUDIT_PASSWORD:-warden_audit}@localhost:5434/audit
  connect_timeout_s: 5

shape:
  max_joins: 4                 # JOINs per query, comma joins included
  max_subquery_depth: 3        # how deep subqueries and CTEs may nest
  # inject:  add a LIMIT when there is none, and lower one above the row cap (max_rows).
  # require: refuse the query instead.
  limit: inject
  # Functions sqlglot doesn't know as standard SQL are refused unless listed here, e.g.
  # [age, pg_typeof]. Built-in dangerous ones (pg_sleep, pg_read_file, dblink, set_config,
  # query_to_xml, ...) are always refused and can't be listed.
  allowed_functions: []
  denied_functions: []         # more names or glob patterns to refuse, e.g. [md5, "regexp_*"]

# Who a server serves. A server is tied to one profile when it starts: --profile, else
# SQL_WARDEN_PROFILE, else default_profile. Agents can't change it; the tools take only SQL.
# A profile's own dsn, usually a role that can read less, is used even when --dsn or
# SQL_WARDEN_DSN is set; profiles without one connect with warehouse.dsn. Leave the section
# out and there is one implicit profile, `all`, that can read everything warehouse.dsn can.
#
# tables is what a profile may query: "*" for every table its role can read, or
# schema.table → "*" (every column, including ones added later) or a list of columns.
# A profile that lists no tables can read nothing. SELECT * needs "*" for the table.
#
# A profile can also set its own max_rows (instead of warehouse.max_rows) and its own cost
# limits (any it leaves out come from the cost section). Like its dsn, they are policy:
# --max-rows doesn't change a profile's own row cap. Its own budgets work the same way: any
# limit it leaves out comes from the budgets section, and `max_refusals: null` lifts one.
#
# masks hide columns a profile may read, keyed schema.table.column:
#   redact   [REDACTED]                     {strategy: redact, text: "***"} to choose the text
#   partial  ********4567: the last 4 kept  {strategy: partial, keep_first: 1, keep_last: 2}
#   hmac     a keyed token, the same for the same value, so it can still be matched
#   null     nothing at all
# A masked column can be selected as it is or counted, but not filtered, joined, grouped,
# sorted or computed with: each could reveal what the mask hides. For a column that is hidden
# but not secret, {strategy: hmac, allow_in_predicates: true} allows those.
default_profile: public
profiles:
  public:          # an agent released to customers
    # A role that can read only these columns, so Postgres enforces them too.
    dsn: postgresql://warden_public:${WARDEN_PUBLIC_PASSWORD:-warden_public}@localhost:5433/warehouse
    tables:
      public.products: [id, name, price_cents]
    max_rows: 50
    cost:
      max_total_cost: 10000
    budgets:       # small, so the limits are easy to reach by hand
      max_queries: 25
      max_total_cost: 50000
      max_rows_returned: 500
      max_refusals: 10
  support:         # a support agent: finds customers and their orders, never sees an SSN
    tables:
      public.customers: "*"
      public.orders: "*"
      public.products: "*"
    masks:
      public.customers.ssn: redact
      public.customers.phone: partial
      public.customers.email: hmac
  admin:           # internal admins
    tables: "*"
    max_rows: 1000
